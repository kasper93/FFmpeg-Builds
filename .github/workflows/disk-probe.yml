name: Disk probe

# Round 3: cost of pulling the CI images from ghcr on demand versus
# saving/loading them through a gzip tarball as FFmpeg-CI's docker image
# cache does.

on:
  push:
    branches: [disk-probe]
  workflow_dispatch:

jobs:
  pull:
    name: pull timing / ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - name: Pull on demand
        run: |
          set -x
          if [[ "$(uname -m)" == "aarch64" ]]; then SUF=-arm; else SUF=; fi
          docker system prune -a -f >/dev/null
          time docker pull ghcr.io/btbn/ffmpeg-builds/base:latest$SUF
          if [[ -z "$SUF" ]]; then
            time docker pull ghcr.io/btbn/ffmpeg-builds/win64-gpl:latest
            time docker pull ghcr.io/btbn/ffmpeg-builds/win64-gpl-9.0:latest
          fi
          docker image ls --format '{{.Repository}}:{{.Tag}} {{.Size}}'
          docker system df
      - name: Save and reload through a gzip tarball (what the cache does)
        run: |
          set -x
          IMAGES=$(docker image ls --format '{{.Repository}}:{{.Tag}}' | grep -v '<none>')
          time (docker image save $IMAGES | gzip > /tmp/images.tgz)
          ls -la /tmp/images.tgz
          docker system prune -a -f >/dev/null
          time (gzip -d < /tmp/images.tgz | docker image load)
          time (docker image save $IMAGES | zstd -T0 -1 > /tmp/images.tzst)
          ls -la /tmp/images.tzst
          docker system prune -a -f >/dev/null
          time (zstd -d -T0 < /tmp/images.tzst | docker image load)
      - name: Re-pull with images present (what force_pull costs)
        run: |
          set -x
          if [[ "$(uname -m)" == "aarch64" ]]; then SUF=-arm; else SUF=; fi
          time docker pull ghcr.io/btbn/ffmpeg-builds/base:latest$SUF
