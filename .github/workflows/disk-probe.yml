name: Disk probe

# Round 4: can FFmpeg-CI's matrix job run on ubuntu-slim?

on:
  push:
    branches: [disk-probe]
  workflow_dispatch:

jobs:
  slim:
    name: ubuntu-slim capability check
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Tools the matrix job needs
        run: |
          set -x
          echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
          nproc; free -g; df -h /
          for t in bash curl jq xz unxz git gh node python3 docker base64 seq; do printf "%-8s %s\n" "$t" "$(command -v $t || echo MISSING)"; done
          docker version 2>&1 | head -2 || true
          VER="$(curl -s https://code.forgejo.org/api/v1/repos/forgejo/runner/releases/latest | jq .name -r | cut -c 2-)"
          echo "forgejo runner version: $VER"
          time (curl -Ls "https://code.forgejo.org/forgejo/runner/releases/download/v${VER}/forgejo-runner-${VER}-linux-amd64.xz" | unxz > runner)
          chmod +x runner && ./runner --version
          jq -cn --argjson c '2' '[range(1; $c+1) as $i | {"os":"windows-latest", "runner_id":$i}]'
      - name: Checkout
        uses: actions/checkout@v7
      - name: actions/cache on ubuntu-slim
        uses: actions/cache@v6
        with:
          key: slim-probe-${{ github.run_id }}
          path: runner
